<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A /health/robots.txt hatástalan (a keresők a host gyökerét nézik) — B12. -->
<meta name="robots" content="noindex">
<title>Morning Brief — Health Centre</title>
<!-- Nappal/éjszaka (2026-11-17): a lap a rendszer témáját követi, mint az index. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  /* Éjszaka (sötét) az alap, nappal a lenti @media írja felül — ugyanaz a paletta, mint az
     index.html-ben (a tests/page_checks.js összeveti, és a kontrasztot is kiszámolja). */
  :root{
    color-scheme: light dark;
    --bg:#0c0c0b; --s1:#1a1a18; --s2:#272724; --s3:#313130;
    --border:rgba(255,255,255,0.1); --border2:rgba(255,255,255,0.2);
    --text:#f5f2ea; --text2:#b8b4ac; --text3:#96928b;
    --teal:#34c99a; --amber:#e8993a; --red:#eb6b6b; --blue:#5b9cf6;
    --on-teal:#0c0c0b; --track:#313130;
    --teal-line:rgba(52,201,154,0.3); --red-bg:rgba(235,107,107,0.12); --amber-bg:rgba(232,153,58,0.12);
    --m:'DM Mono',monospace; --sans:'Plus Jakarta Sans',system-ui,sans-serif;
    --r:16px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f7f5f0; --s1:#ffffff; --s2:#f0ede6; --s3:#e7e3da;
      --border:rgba(26,25,22,0.12); --border2:rgba(26,25,22,0.22);
      --text:#1a1916; --text2:#57544e; --text3:#67645e;
      --teal:#1a6f57; --amber:#a14d07; --red:#b42318; --blue:#1f5fd1;
      --on-teal:#ffffff; --track:rgba(26,25,22,0.08);
      --teal-line:rgba(26,111,87,0.3); --red-bg:rgba(180,35,24,0.08); --amber-bg:rgba(161,77,7,0.08);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;
       line-height:1.5;-webkit-font-smoothing:antialiased;padding:2rem 1.25rem 3rem}
  .wrap{max-width:640px;margin:0 auto}
  .lbl{font-family:var(--m);font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}

  /* Header */
  header{margin-bottom:2rem}
  .kicker{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:.9rem}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
  .greet{font-size:30px;font-weight:300;letter-spacing:-.5px;line-height:1.15;margin-bottom:.35rem}
  .subline{font-family:var(--m);font-size:12px;color:var(--text2)}

  /* Recovery hero */
  .hero{display:flex;align-items:center;gap:1.5rem;background:var(--s1);border:.5px solid var(--border);
        border-radius:var(--r);padding:1.4rem 1.6rem;margin-bottom:1rem}
  .ring{flex-shrink:0;width:96px;height:96px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num b{font-size:30px;font-weight:400}
  .ring .num s{font-family:var(--m);font-size:9px;color:var(--text3);text-decoration:none}
  .hero-txt h2{font-size:18px;font-weight:500;margin-bottom:.3rem}
  .hero-txt p{font-size:13px;color:var(--text2)}

  /* Stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1.75rem}
  @media(max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .tile{background:var(--s2);border-radius:12px;padding:.9rem 1rem;min-width:0}
  .tile .v{font-size:22px;font-weight:300;letter-spacing:-.5px;line-height:1;margin:6px 0 4px}
  .tile .s{font-family:var(--m);font-size:10px;color:var(--text3)}

  /* Sections */
  section{margin-bottom:1.75rem}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:.9rem}
  .sec-head .lbl{white-space:nowrap}
  .sec-head .line{flex:1;height:.5px;background:var(--border)}
  .card{background:var(--s1);border:.5px solid var(--border);border-radius:var(--r);padding:1.25rem 1.4rem}

  /* Focus list */
  .focus li{list-style:none;display:flex;gap:10px;padding:.55rem 0;font-size:14px;color:var(--text)}
  .focus li+li{border-top:.5px solid var(--border)}
  .focus .b{color:var(--teal);flex-shrink:0}

  /* Schedule */
  .ev{display:flex;align-items:flex-start;gap:12px;padding:.55rem 0}
  .ev+.ev{border-top:.5px solid var(--border)}
  .ev .t{font-family:var(--m);font-size:12px;color:var(--text3);min-width:52px;padding-top:1px}
  .ev .ti{font-size:14px;flex:1}
  .ev .cat{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:7px}
  .empty{font-family:var(--m);font-size:12px;color:var(--text3)}

  /* Footer strips */
  .strip{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;font-family:var(--m);font-size:12px;color:var(--text2);
         padding:.9rem 1.1rem;background:var(--s2);border-radius:12px}
  .strip b{color:var(--text);font-weight:500}
  footer{margin-top:2.5rem;font-family:var(--m);font-size:10px;color:var(--text3);text-align:center;letter-spacing:.06em}

  .pill{display:inline-block;font-family:var(--m);font-size:10px;padding:2px 9px;border-radius:20px;margin-left:8px}
  .stale{font-family:var(--m);font-size:11px;padding:.55rem .85rem;margin-bottom:1rem;border:1px solid;border-radius:8px}
  /* A párosító link visszajelzése (pairing.js, csak textContent). */
  .pair-note{max-width:640px;margin:0 auto 1.25rem;padding:.65rem 1rem;background:var(--s2);border-radius:12px;
             font-family:var(--m);font-size:12px;color:var(--text2);word-break:break-word;overflow-wrap:anywhere}

  @media print{
    body{background:#fff;color:#141414;padding:0}
    .hero,.card{background:#fff;border:1px solid #e2e2e2}
    .tile,.strip{background:#f4f4f2}
    .greet,.hero-txt h2,.tile .v,.ev .ti,.focus li{color:#141414}
    .subline,.tile .s,.sec .lbl,.ev .t,.strip,.empty{color:#555}
    footer{color:#999}
    .dot,.pair-note{display:none}
    @page{margin:1.4cm}
  }
</style>
</head>
<body>
<div id="pairNote" class="pair-note" role="status" hidden></div>
<div class="wrap" id="root">
  <p class="lbl" id="loading">Loading brief…</p>
</div>

<script src="freshness.js"></script>
<script src="pairing.js"></script>
<script>
// A színek a témából (CSS-változók): minden felhasználásuk inline stílus, ott a var() működik.
const C = {teal:'var(--teal)',amber:'var(--amber)',red:'var(--red)',blue:'var(--blue)',text3:'var(--text3)'};
const DEMO = new URLSearchParams(location.search).get('demo')==='1';  // ?demo=1 → sample data
const CAT = {work:C.amber,gym:C.teal,wellness:C.teal,social:C.blue,study:C.blue,travel:C.amber,personal:C.text3,other:C.text3};
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// A külső szöveget EGY belépési ponton semlegesítjük, nem helyszínenként. A
// helyszínenkénti escape-elés egy helyet kihagyott (az esemény ideje), és ez
// pontosan az a hiba, ami a dashboardon 2026-08-24-én tokent szivárogtatott.
// A kulcs is külső szöveg (B2): ugyanúgy semlegesítjük, mint az értéket.
function deepEscape(v){
  if (typeof v === 'string') return esc(v);
  if (Array.isArray(v)) return v.map(deepEscape);
  if (v && typeof v === 'object'){ const o={}; for(const k in v) o[esc(k)]=deepEscape(v[k]); return o; }
  return v;
}
const band = (v,hi,mid) => v==null?C.text3 : v>=hi?C.teal : v>=mid?C.amber : C.red;

// Same thresholds/labels as the dashboard's coachingVerdict — the two pages
// must never disagree about the same score.
function verdict(r){
  if(r==null) return {h:'No readiness data',p:'Wear your watch to bed for a recovery score.'};
  if(r>=90) return {h:'Prime condition',p:'All systems go — a great day to push hard.'};
  if(r>=75) return {h:'Well recovered',p:'Good recovery overnight. A solid session is in order.'};
  if(r>=60) return {h:'Moderate readiness',p:'Train if you need to, but keep intensity moderate.'};
  return {h:'Focus on energy',p:'Recovery is low — light movement, good food and sleep will serve you best.'};
}
function ring(score,color){
  const R=42,C2=2*Math.PI*R,pct=Math.max(0,Math.min(100,score||0))/100;
  return `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96">
    <circle cx="48" cy="48" r="${R}" fill="none" style="stroke:var(--track)" stroke-width="6"/>
    <circle cx="48" cy="48" r="${R}" fill="none" style="stroke:${color}" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${C2}" stroke-dashoffset="${C2*(1-pct)}"/>
  </svg><div class="num"><b>${score??'—'}</b><s>/100</s></div></div>`;
}

function greeting(){
  const h=new Date().getHours();
  return h<12?'Good morning':h<18?'Good afternoon':'Good evening';
}

// A teljes Open-Meteo-lista (open-meteo.com/en/docs, "WMO Weather interpretation codes").
// A listán kívüli vagy hiányzó kód címkéje null — a sáv "—"-t vagy semmit ír, nem kitalált szót.
const WMO={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Foggy',48:'Foggy',51:'Drizzle',53:'Drizzle',55:'Drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Snow',73:'Snow',75:'Snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm',97:'Heavy thunderstorm',99:'Thunderstorm with hail'};
const wmoLabel=c=>(typeof c==='number'&&Object.prototype.hasOwnProperty.call(WMO,c))?WMO[c]:null;
// Live weather for the viewing device's actual location (phone/laptop GPS).
async function deviceWeather(){
  if(!navigator.geolocation) return null;
  const pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:8000,maximumAge:900000}));
  const la=pos.coords.latitude, lo=pos.coords.longitude;
  const wr=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code&daily=uv_index_max,precipitation_sum&timezone=auto&forecast_days=1`).then(r=>r.json());
  let city='';
  try{const g=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=en`).then(r=>r.json()); city=g.city||g.locality||'';}catch(e){}
  const c=wr.current||{}, dy=wr.daily||{};
  // Hiányzó adatból nem lesz állítás: ha nincs csapadék-érték, a precip_mm és a rain
  // null ("nem tudjuk"), nem 0 mm / "nem esik". A valódi 0 marad 0.
  const first=a=>{ const v=Array.isArray(a)?a[0]:null; return typeof v==='number'&&isFinite(v)?v:null; };
  const precip=first(dy.precipitation_sum);
  return {temp:c.temperature_2m, description:wmoLabel(c.weather_code), uv_index:first(dy.uv_index_max), precip_mm:precip, rain:precip==null?null:precip>0.5, city};
}
function wxHtml(w, live){
  if(w.temp==null) return '';
  const loc = live ? ` · 📍 ${w.city||'your location'}` : (w.city ? ` · 📍 ${w.city}` : '');
  return `<span>🌡 <b>${Math.round(w.temp)}°C</b> ${w.description||''}${loc}</span>
     ${w.uv_index!=null?`<span>☀️ UV <b>${w.uv_index}</b></span>`:''}
     ${w.rain?`<span>🌧 ${w.precip_mm!=null?`<b>${w.precip_mm}mm</b> `:''}rain</span>`:''}`;
}

function render(d){
  d = deepEscape(d);   // KÖTELEZŐ első lépés — ne mozgasd lejjebb
  const g=d.garmin||{}, dp=(d.day_plan||{}).today||{}, w=d.weather||{}, ir=d.illness_risk||{};
  // A terv NAPJA a dokumentumból jön (synced_at — a sync a day_plan-t ugyanabból a
  // pillanatból írja), a NAPSZÓ viszont a NÉZŐ helyi mai napjához mért, ugyanúgy, mint az
  // index.html planDayLabel-jében: 15-én reggel a 14-i terv nem "Today's focus".
  // Ha a synced_at hiányzik vagy nem dátum, nem találunk ki dátumot (rel = null).
  // Minden itt kiírt dátum a lap saját toLocaleDateString-je, nem a payload szövege.
  const sm = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d.synced_at||''));
  let planDay = sm ? new Date(+sm[1], +sm[2]-1, +sm[3]) : null;       // számokból (Safari)
  if (planDay && (planDay.getMonth() !== +sm[2]-1 || planDay.getDate() !== +sm[3])) planDay = null;
  const planIso = planDay ? `${sm[1]}-${sm[2]}-${sm[3]}` : null;
  const n0 = new Date(), today0 = new Date(n0.getFullYear(), n0.getMonth(), n0.getDate());
  const rel = planDay ? Math.round((planDay - today0) / 86400000) : null;   // kerekítve: óraátállításkor is egész
  const longDate = planDay ? planDay.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}) : '';
  const shortDate = planDay ? planDay.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
  const W = rel === null ? {kicker:'Morning Brief', focus:'Focus', noPlan:'No plan generated.', noEv:'No date in the data — schedule not shown.'}
    : rel === 0  ? {kicker:`Morning Brief · ${longDate}`, focus:"Today's focus", noPlan:'No plan generated for today.', noEv:'Nothing scheduled today.'}
    : rel === -1 ? {kicker:`Morning Brief · Yesterday · ${longDate}`, focus:"Yesterday's focus", noPlan:'No plan from yesterday.', noEv:'Nothing was scheduled yesterday.'}
    : rel === 1  ? {kicker:`Morning Brief · Tomorrow · ${longDate}`, focus:"Tomorrow's focus", noPlan:'No plan generated for tomorrow.', noEv:'Nothing scheduled tomorrow.'}
    :              {kicker:`Morning Brief · Plan from ${longDate}`, focus:`Plan from ${shortDate}`, noPlan:`No plan from ${shortDate}.`, noEv:`Nothing scheduled on ${shortDate}.`};
  const r=g.readiness_score, v=verdict(r);

  // stat tiles
  const tiles = [
    {l:'🔋 Body Battery', v:g.bb_current??'—', s:g.bb_charged!=null?`+${g.bb_charged} charged`:'energy', c:band(g.bb_current,60,40)},
    {l:'😴 Sleep', v:g.sleep_hours!=null?g.sleep_hours+'h':'—', s:g.sleep_score!=null?`score ${g.sleep_score}`:'last night', c:band(g.sleep_hours,7.5,6.5)},
    {l:'💓 HRV', v:g.hrv_last_night??'—', s:g.hrv_status||'last night', c:(g.hrv_status||'').toLowerCase()==='balanced'?C.teal:C.amber},
    {l:'❤️ Resting HR', v:g.resting_hr??'—', s:'bpm', c:band(g.resting_hr==null?null:(70-g.resting_hr),10,0)},
  ];
  const tilesHTML = tiles.map(t=>`<div class="tile"><div class="lbl">${t.l}</div>
    <div class="v" style="color:${t.c}">${t.v}</div><div class="s">${t.s}</div></div>`).join('');

  // focus lines
  const lines = (dp.lines||[]).filter(Boolean);
  const focusHTML = lines.length
    ? `<ul class="focus">${lines.map(l=>`<li><span class="b">›</span><span>${l}</span></li>`).join('')}</ul>`
    : `<div class="empty">${W.noPlan}</div>`;

  // a terv napjának eseményei (a cím mondja meg, melyik nap az); dátum nélkül egy sem
  const evs = (planIso ? (d.calendar||[]) : []).filter(e=>e && e.start_date===planIso)
    .sort((a,b)=>((a.time||'~')>(b.time||'~')?1:-1));
  const evHTML = evs.length ? evs.map(e=>{
    const t=(e.time||'').trim();
    return `<div class="ev"><span class="cat" style="background:${CAT[e.category]||C.text3}"></span>
      <span class="t">${t||'all day'}</span>
      <span class="ti">${(e.title||'').replace(/\[pending\]/gi,'').trim()}</span></div>`;
  }).join('') : `<div class="empty">${W.noEv}</div>`;

  // weather + illness strip — wrapped so device geolocation can update it live
  const wx = `<span id="wxLine">${wxHtml(w,false)}</span>`;
  const hasStrip = (w.temp!=null) || (ir.score!=null);
  const illHTML = (ir.score!=null) ? `<span>🛡 Illness risk <b style="color:${band(100-ir.score,75,50)}">${ir.score}/100</b>${(ir.factors||[]).length?` · ${ir.factors.join(', ')}`:''}</span>` : '';

  // Elavultság (B9): ugyanaz a számítás és küszöb, mint a dashboard sávjáé
  // (freshness.js), a MOSTANI időhöz mérve. Korábban a brief egyáltalán nem jelzett.
  const stale = HealthFreshness.stale(d.freshness, Date.now());
  const red = stale.length && Math.max(...stale.map(x=>x.days)) >= HealthFreshness.RED_DAYS;
  const staleHTML = stale.length
    ? `<div class="stale" style="color:var(${red?'--red':'--amber'});background:${red?'var(--red-bg)':'var(--amber-bg)'}">⚠ Showing older data — ${stale.map(x=>`<b>${x.name}</b> from ${x.when} (${x.days}d)`).join(' · ')}</div>`
    : '';

  document.getElementById('root').innerHTML = `
    <header>
      <div class="kicker"><span class="dot"></span><span class="lbl">${esc(W.kicker)}</span>${DEMO?'<span class="lbl" style="color:var(--teal);border:1px solid var(--teal-line);border-radius:20px;padding:1px 8px">DEMO</span>':''}</div>
      <div class="greet">${greeting()}, Feri.</div>
      <div class="subline">${esc(v.h)} — ${esc(v.p)}</div>
    </header>
    ${staleHTML}

    <div class="hero">
      ${ring(r, band(r,65,45))}
      <div class="hero-txt"><h2>Readiness ${r??'—'}</h2><p>${esc(v.p)}</p></div>
    </div>

    <div class="tiles">${tilesHTML}</div>

    <section>
      <div class="sec-head"><span class="lbl">${esc(W.focus)}</span><span class="line"></span></div>
      <div class="card">${focusHTML}</div>
    </section>

    <section>
      <div class="sec-head"><span class="lbl">Schedule</span><span class="line"></span></div>
      <div class="card">${evHTML}</div>
    </section>

    ${hasStrip?`<div class="strip">${wx}${illHTML}</div>`:''}

    <footer>Generated from Health Centre · synced ${d.synced_at||'—'}</footer>`;

  // Follow the viewing device's location (phone/laptop GPS) if allowed.
  deviceWeather().then(w2=>{
    const el=document.getElementById('wxLine');
    if(w2 && w2.temp!=null && el) el.innerHTML = wxHtml(deepEscape(w2), true);  // saját belépési pont
  }).catch(()=>{});
}

// Adatforrás: demó → privát végpont (Worker) → publikus data.json (fallback).
(async () => {
  // Párosító link (…/health/brief.html#api=…&key=…) és a tárolt beállítás: a
  // dashboarddal közös, őrzött kezelő (pairing.js). Korábban itt kérdés és
  // séma-ellenőrzés nélkül íródott a localStorage (B1).
  const {api, key} = HealthPairing.run();
  try {
    const ok = x => x && typeof x === 'object' && x.synced_at && x.garmin
                    && Object.keys(x).length >= 8;
    const use = x => { if (!ok(x)) throw new Error('data looks incomplete'); return render(x); };
    if (DEMO) return use(await (await fetch('demo-data.json',{cache:'no-store'})).json());
    if (api && key) {
      const r = await fetch(`${api}/data`, {headers:{'Authorization':'Bearer '+key}, cache:'no-store'});
      if (r.ok) return use(await r.json());
      console.warn('privát végpont:', r.status, '— publikus fallback');
    }
    const r2 = await fetch('data.json',{cache:'no-store'});
    if (!r2.ok) throw new Error('data.json '+r2.status);
    use(await r2.json());
  } catch (e) {
    document.getElementById('loading').textContent = 'Could not load data ('+e.message+').';
  }
})();
</script>
</body>
</html>
